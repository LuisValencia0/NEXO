<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Fondo (Ajustado al color oscuro azulado de la imagen) -->
  <rect width="32" height="32" rx="7" fill="#1a2235"/>

  <!-- Aro exterior flotante con brillo -->
  <polygon points="16,2.5 28,9 28,23 16,29.5 4,23 4,9" 
           fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>

  <!-- Cuerpo del hexágono 3D -->
  <!-- Cara Superior (Blanco/Cian claro) -->
  <polygon points="16,5 26.5,10.5 16,16 5.5,10.5" fill="#d4f8ff"/>
  
  <!-- Cara Izquierda (Cian brillante) -->
  <polygon points="5.5,10.5 16,16 16,27 5.5,21.5" fill="#00c3e3"/>
  
  <!-- Cara Derecha (Azul sólido) -->
  <polygon points="26.5,10.5 16,16 16,27 26.5,21.5" fill="#0055cc"/>
  
  <!-- Bisel interior (El hueco oscuro) -->
  <polygon points="16,9.5 22.5,13 22.5,20 16,23.5 9.5,20 9.5,13" 
           fill="#151b2a" stroke="#00e5ff" stroke-width="0.8"/>
           
  <!-- Sombra interna del bisel para dar profundidad (Imitando la imagen) -->
  <polygon points="16,9.5 22.5,13 16,16 9.5,13" fill="#0d121c" opacity="0.7"/>
  <polygon points="9.5,13 16,16 16,23.5 9.5,20" fill="#0d121c" opacity="0.4"/>

  <!-- Estrella central (Asterisco de 8 puntas) -->
  <g stroke="#00e5ff" stroke-width="1.1" stroke-linecap="round" fill="none">
    <!-- Verticales y horizontales -->
    <line x1="16" y1="11" x2="16" y2="22" />
    <line x1="11" y1="16.5" x2="21" y2="16.5" />
    <!-- Diagonales -->
    <line x1="12.5" y1="13" x2="19.5" y2="20" />
    <line x1="19.5" y1="13" x2="12.5" y2="20" />
  </g>

  <!-- Puntos en las puntas horizontales -->
  <circle cx="10" cy="16.5" r="0.7" fill="#00e5ff"/>
  <circle cx="22" cy="16.5" r="0.7" fill="#00e5ff"/>
  
  <!-- Punto superior (como en la imagen original) -->
  <circle cx="16" cy="8.5" r="0.6" fill="#00e5ff"/>
</svg>